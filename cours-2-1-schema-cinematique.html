<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cours 2.1 — Le schéma cinématique (en cours d&#x27;édition)</title>
<meta name="description" content="Classes d&#x27;équivalence, graphe des liaisons et premier schéma cinématique.">
<style>:root{
  --beton:#E3E5E0; --papier:#FFFFFF; --encre:#1C2530; --encre-2:#46525C;
  --trait:#A5ADAA; --trait-fin:#D3D8D5;
  --jaune:#F2B705; --jaune-pale:#FFF3C4;
  --bleu:#1F5FA8; --bleu-pale:#E6EEF8;
  --vert:#1B7A43; --vert-pale:#E2F1E7; --rouge:#B42318; --rouge-pale:#FBE6E4;
  --orange:#B26A00; --orange-pale:#FCEFD8;
  --f-titre:"Bahnschrift","DIN Alternate","DIN Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-texte:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rail:58px; --panel:min(900px, 47vw); --banner:58px;
}
*{box-sizing:border-box}
html{scroll-padding-top:16px; scroll-padding-bottom:calc(var(--banner) + 16px)}
body{margin:0; background:var(--beton); color:var(--encre); font:16px/1.55 var(--f-texte);
  font-variant-numeric:tabular-nums; padding-bottom:calc(var(--banner) + 40px)}
img{max-width:100%; height:auto}
sub,sup{line-height:0}
button,input{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--bleu); outline-offset:2px}
.small{font-size:.9rem; color:var(--encre-2)}
.print-only{display:none}

/* ---------- mise en page ---------- */
.page{max-width:900px; margin:0 auto; padding:28px 22px 0; transition:margin .25s ease}
body.panel-open .page{margin-right:calc(var(--panel) + var(--rail) + 24px); margin-left:24px}
@media (max-width:1180px){ body.panel-open .page{margin:0 auto} }

/* ---------- cartouche ---------- */
.cartouche{background:var(--papier); border:2px solid var(--encre); display:grid;
  grid-template-columns:1fr; margin-bottom:26px}
.cartouche>div{border-right:1px solid var(--encre); border-bottom:1px solid var(--encre); padding:8px 12px}
.cartouche>div:nth-child(3n){border-right:0}
.cartouche .k{display:block; font:600 .72rem/1.2 var(--f-titre); letter-spacing:.02em; color:var(--encre-2)}
.cartouche .v{font:600 1rem/1.3 var(--f-titre)}
.cartouche .title{grid-column:1/-1; border-right:0; padding:18px 16px 16px}
.cartouche h1{margin-top:0}
.cartouche h1{font:700 clamp(1.6rem,3.6vw,2.35rem)/1.08 var(--f-titre); margin:2px 0 6px; letter-spacing:-.01em}
.cartouche .title p{margin:0; color:var(--encre-2)}
.cartouche .nom{grid-column:1/-1; border-bottom:0; display:flex; gap:10px; align-items:center}
.cartouche .nom label{font:600 .9rem var(--f-titre)}
.cartouche .nom input{flex:1; border:0; border-bottom:1px dashed var(--trait); padding:4px 2px; background:transparent}


.consignes{background:var(--papier); border-left:6px solid var(--jaune); padding:12px 16px; margin:0 0 30px}
.consignes p{margin:.2rem 0}

/* ---------- parties ---------- */
.part{background:var(--papier); margin:0 0 34px; padding:0 0 22px; border:1px solid var(--trait-fin)}
.part-head{display:grid; grid-template-columns:64px 1fr; border-bottom:2px solid var(--encre)}
.part-num{background:var(--encre); color:var(--jaune); font:700 2.3rem/1 var(--f-titre);
  display:flex; align-items:center; justify-content:center}
.part-head h2{font:700 1.45rem/1.15 var(--f-titre); margin:0; padding:12px 16px 2px}
.part-head .duree{padding:0 16px 10px; font-size:.9rem; color:var(--encre-2)}
.part-body{padding:4px 22px 0}
.part-body>p,.part-body>ul{max-width:72ch}
h4.sub{font:700 1.1rem var(--f-titre); margin:26px 0 6px; padding-top:10px; border-top:1px dashed var(--trait)}

/* barre de question (reprend l'en-tête du questionnaire) */
.qbar{display:grid; grid-template-columns:auto 1fr auto; align-items:stretch; margin:30px 0 10px;
  border:1.5px solid var(--encre); font:500 .95rem/1.2 var(--f-titre)}
.qbar>*{padding:7px 10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.qbar .qb-num{background:var(--jaune); font-weight:700; font-size:1.1rem; border-right:1.5px solid var(--encre); min-width:64px; justify-content:center}
.qbar .qb-ans{border-left:1.5px solid var(--encre)}
.qbar .qb-title{grid-column:1/-1; border-top:1px solid var(--encre); font-weight:700; font-style:italic}
@media (max-width:640px){ .qbar{grid-template-columns:auto 1fr} .qbar .qb-ans{grid-column:1/-1; border-left:0; border-top:1px solid var(--encre)} }
.doc-chip{border:1.5px solid var(--encre); background:var(--papier); padding:2px 8px; font:700 .88rem var(--f-titre);
  cursor:pointer; border-radius:2px}
.doc-chip:hover{background:var(--jaune-pale)}
.doc-chip[aria-pressed="true"]{background:var(--jaune)}

/* données */
.data{border:1px solid var(--encre); padding:8px 14px; margin:12px 0; max-width:72ch; background:#FBFBF9}
.data p{margin:.25rem 0}
.data .data-title{font:700 .95rem var(--f-titre); text-decoration:underline; text-underline-offset:3px}
.data ul{margin:.2rem 0; padding-left:1.1rem}
.data ul.cols{columns:2; column-gap:28px}
@media (max-width:560px){ .data ul.cols{columns:1} }

figure{margin:14px 0}
.fig img,.fig svg{display:block; width:100%; height:auto; border:1px solid var(--trait-fin); background:#fff}
figcaption{font-size:.85rem; color:var(--encre-2); margin-top:4px}
.fig1 .lead line{stroke:#6B7580; stroke-width:1}
.fig1 .lab text{font:600 15px var(--f-titre); fill:var(--encre)}
.fig1 .dir{stroke:var(--encre); stroke-width:3; fill:none}
.fig1 .dirhead{fill:var(--encre)}
.split{display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap}
.small-fig{width:220px; margin:0}

.chain{display:flex; align-items:center; flex-wrap:wrap; gap:0; margin:18px 0 8px}
.chain-box{border:2px solid var(--encre); padding:8px 10px; min-width:130px; text-align:center; background:#fff}
.chain-box span{display:block; font-size:.9rem}
.chain-box b{font:700 .95rem var(--f-titre)}
.chain-arrow{width:34px; height:2px; background:var(--encre); position:relative; margin:0 2px}
.chain-arrow::after{content:""; position:absolute; right:-1px; top:-5px; border:6px solid transparent; border-left:9px solid var(--encre); border-right:0}
.chain figcaption{flex-basis:100%}

table.t{border-collapse:collapse; margin:10px 0; font-size:.93rem; width:100%}
table.t th,table.t td{border:1px solid var(--trait); padding:4px 8px; text-align:left; vertical-align:top}
table.t th{background:#EEF0EC; font:600 .88rem var(--f-titre)}
table.nomencl{width:auto; min-width:210px}
table.nomencl td:first-child{font-weight:700; text-align:center}

.vec{position:relative; display:inline-block; font-style:italic}
.vec::before{content:""; position:absolute; left:0; right:-1px; top:-.12em; height:1.2px; background:currentColor}
.vec::after{content:""; position:absolute; right:-3px; top:-.32em; border:.2em solid transparent; border-left:.36em solid currentColor; border-right:0}

/* ---------- questions ---------- */
.q{margin:14px 0 6px; padding:10px 0 12px 14px; border-left:3px solid var(--trait-fin)}
.q.is-ok{border-left-color:var(--vert)} .q.is-ko{border-left-color:var(--rouge)} .q.is-half{border-left-color:var(--orange)}
.q-stem{margin:0 0 3px; max-width:74ch}
.q-num{display:inline-block; font:700 .92rem var(--f-titre); background:var(--encre); color:#fff; padding:1px 7px; margin-right:6px; border-radius:2px}
.q-hint{margin:0 0 8px; font-size:.88rem; color:var(--encre-2); max-width:74ch}
.q-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.q-input{flex:1 1 240px; max-width:420px; border:1.5px solid var(--encre-2); background:#fff; padding:7px 10px; border-radius:2px}
.q-input:disabled{background:#F2F3F1; color:var(--encre); -webkit-text-fill-color:var(--encre)}
.is-ok .q-input{border-color:var(--vert); background:var(--vert-pale)}
.is-half .q-input{border-color:var(--orange); background:var(--orange-pale)}
.is-ko .q-input{border-color:var(--rouge); background:var(--rouge-pale)}
.btn{border:1.5px solid var(--encre); background:var(--encre); color:#fff; padding:7px 14px; border-radius:2px; cursor:pointer; font-weight:600}
.btn:hover{background:#2E3B47}
.btn:disabled{background:#9AA2A8; border-color:#9AA2A8; cursor:not-allowed}
.btn.ghost{background:#fff; color:var(--encre)}
.btn.ghost:hover{background:var(--jaune-pale)}
.q-status{font-weight:700; font-size:.95rem}
.is-ok .q-status{color:var(--vert)} .is-ko .q-status{color:var(--rouge)} .is-half .q-status{color:var(--orange)}
.q-msg{margin:4px 0 0; font-size:.88rem; color:var(--rouge); min-height:0}
.q-msg:empty{display:none}
.q-expl{margin-top:10px; background:#F6F7F4; border:1px solid var(--trait-fin); padding:8px 14px; max-width:78ch}
.is-ok .q-expl{border-top:3px solid var(--vert)} .is-ko .q-expl{border-top:3px solid var(--rouge)} .is-half .q-expl{border-top:3px solid var(--orange)}
.q-unit-msg{margin:.1rem 0 .4rem; font-weight:600; color:var(--orange)}
.q-unit-msg[hidden]{display:none}
.q-expl p{margin:.35rem 0}
.q-expected span,.q-yours span.lab{font:700 .9rem var(--f-titre)}
.q-expl ul,.q-expl ol{padding-left:1.2rem; margin:.3rem 0}
.q-expl li{margin:.2rem 0}
.cor-imgs{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px}
.cor-imgs figure{margin:0; flex:1 1 260px}
.cor-imgs img{border:1px solid var(--trait-fin); background:#fff; display:block}
.reveal{animation:reveal .35s ease-out}
@keyframes reveal{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}

/* ---------- FAST ---------- */
.fast-wrap{overflow-x:auto; padding:6px 0 4px}
.fast{display:grid; min-width:720px; grid-template-columns:138px 24px 112px 24px minmax(180px,1fr) 18px 178px; grid-auto-rows:minmax(64px,auto);
  font-size:.84rem; line-height:1.25}
.fast .box{border:1.5px solid var(--encre); background:#fff; padding:6px 8px; align-self:center}
.fast .fp{grid-column:1; grid-row:1/9; font-weight:700}
.fast .ft{grid-column:3}
.fast .ft2{grid-column:5}
.fast .sol{grid-column:7; align-self:center}
.fast .sol input{width:100%; border:1.5px dashed var(--encre-2); padding:9px 8px; background:#fff; border-radius:0; font-size:.9rem}
.fast .sol.is-ok input{border:2px solid var(--vert); background:var(--vert-pale)}
.fast .sol.is-ko input{border:2px solid var(--rouge); background:var(--rouge-pale)}
.fast .sol .mark{display:block; font-size:.78rem; font-weight:700; margin-top:2px; min-height:1em}
.fast .sol.is-ok .mark{color:var(--vert)} .fast .sol.is-ko .mark{color:var(--rouge)}
.fast .cn{position:relative}
.fast .cn::before{content:""; position:absolute; left:0; right:0; top:50%; border-top:1.5px solid var(--encre)}
.fast .bus{position:relative}
.fast .bus::before{content:""; position:absolute; left:0; right:0; top:50%; border-top:1.5px solid var(--encre)}
.fast .bus::after{content:""; position:absolute; left:0; top:0; bottom:0; border-left:1.5px solid var(--encre)}
.fast .bus.first::after{top:50%} .fast .bus.last::after{bottom:50%}
.fast .bus.mid::before{display:none}
.fast .ft.grp{position:relative}
.fast .ft.grp::before{content:""; position:absolute; right:100%; width:24px; top:50%; border-top:1.5px solid var(--encre)}
.fast .dash::before{border-top-style:dashed}
.fast .note{grid-column:5/8; align-self:center; color:var(--encre-2); font-style:italic; padding-left:8px}
.fast-foot{display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap}

/* ---------- tracés ---------- */
.sketch{margin:14px 0 6px; padding:10px 0 12px 14px; border-left:3px dashed var(--bleu)}
.sk-layout{display:flex; flex-direction:column-reverse; gap:8px}
.sk-main{min-width:0}
.sk-side{max-width:78ch}
.sk-side p,.sk-side ul{margin:.2rem 0}
.nomencl-grid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); border:1px solid var(--trait); font-size:.85rem; margin:2px 0 4px}
.nomencl-grid span{padding:3px 8px; border-right:1px solid var(--trait-fin); border-bottom:1px solid var(--trait-fin)}
.nomencl-grid b{font-family:var(--f-titre); margin-right:6px}
@media (max-width:640px){ .nomencl-grid{grid-template-columns:repeat(2, minmax(0,1fr))} }
.sk-toolbar{display:flex; flex-wrap:wrap; gap:4px; align-items:center; background:#EEF1F4; border:1px solid var(--trait); border-bottom:0; padding:5px}
.sk-toolbar button{border:1px solid var(--trait); background:#fff; padding:4px 9px; font-size:.86rem; cursor:pointer; border-radius:2px; line-height:1.2}
.sk-toolbar button[aria-pressed="true"]{background:var(--bleu); color:#fff; border-color:var(--bleu)}
.sk-toolbar button:disabled{opacity:.45; cursor:not-allowed}
.sk-toolbar .sep{width:1px; align-self:stretch; background:var(--trait); margin:0 4px}
.sk-toolbar .tb-group{display:inline-flex; align-items:center; gap:4px; white-space:nowrap}
.sk-toolbar .tb-lab{font:600 .78rem var(--f-titre); color:var(--encre-2); padding:0 2px}
.sk-toolbar .zoom-val{font:600 .82rem var(--f-titre); min-width:3.6em; text-align:center}
.sk-toolbar .btn-drprint{font-weight:600; border-color:var(--encre)}
.sk-toolbar .btn-drprint:hover{background:var(--jaune-pale)}
.sk-toolbar .sw{width:24px; height:24px; padding:0; border-radius:50%; border:2px solid #fff; outline:1px solid var(--trait)}
.sk-toolbar .sw[aria-pressed="true"]{outline:2px solid var(--encre)}
.sk-toolbar .spacer{flex:1}
.sk-stage{position:relative; border:1px solid var(--trait); background:#fff; line-height:0; overflow:hidden}
.sk-stage.zoomed{overflow:auto; max-height:min(72vh,640px)}
/* au zoom, seule la largeur pilote la taille : la hauteur suit, sinon l'image est écrasée */
.sk-stage.zoomed canvas{max-width:none!important; max-height:none!important; height:auto!important}
.sk-stage canvas{display:block; width:100%; height:auto; touch-action:none; cursor:crosshair}
.sketch.locked .sk-stage canvas{cursor:default; touch-action:auto}
.sketch.tool-erase .sk-stage canvas{cursor:cell}
.sk-toolbar button[data-tool="erase"][aria-pressed="true"]{background:var(--rouge); border-color:var(--rouge)}
.sk-text{position:absolute; line-height:1.2; font:600 15px var(--f-texte); border:1.5px solid var(--bleu); padding:1px 4px; min-width:90px; background:#fff; z-index:2}
.sk-foot{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:8px}
.sk-meas{font-size:.85rem; color:var(--bleu); font-weight:600}
.sk-corr-toggle{display:none; align-items:center; gap:6px; font-size:.92rem; cursor:pointer}
.sketch.revealed .sk-corr-toggle{display:inline-flex}
.sk-note{font-size:.86rem; color:var(--encre-2)}
.sketch.is-full{position:fixed; inset:0; z-index:60; background:var(--beton); margin:0; padding:10px; border:0; overflow:auto; display:flex; flex-direction:column}
.sketch.is-full .sk-side,.sketch.is-full .q-stem,.sketch.is-full .q-expl,.sketch.is-full .sk-note-wrap{display:none}
.sketch.is-full .sk-layout{flex:1; min-height:0}
.sketch.is-full .sk-main{display:flex; flex-direction:column; align-items:center; height:100%}
.sketch.is-full .sk-toolbar{width:100%}
.sketch.is-full .sk-stage{max-width:100%}
.sketch.is-full .sk-stage.zoomed{max-height:calc(100vh - 150px); width:100%; align-self:stretch}
.sketch.is-full .sk-stage canvas{width:auto; max-width:100%; max-height:calc(100vh - 120px)}
body.sk-full-open{overflow:hidden}
body.sk-full-open .banner,body.sk-full-open .rail{display:none}

/* ---------- rail d'onglets ---------- */
.rail{position:fixed; right:0; top:0; bottom:var(--banner); width:var(--rail); z-index:40; display:flex; flex-direction:column;
  justify-content:center; gap:3px; padding:8px 0}
.rail .grp{height:14px}
.tab{display:block; width:100%; border:1.5px solid var(--encre); border-right:0; background:var(--papier); color:var(--encre);
  font:700 .9rem/1 var(--f-titre); padding:10px 0 10px 4px; cursor:pointer; border-radius:4px 0 0 4px; text-align:center;
  transform:translateX(6px); transition:transform .15s ease, background .15s}
.tab.dt{background:var(--jaune)}
.tab:hover{transform:translateX(0)}
.tab[aria-selected="true"]{transform:translateX(0); background:var(--encre); color:var(--jaune)}
@media (max-width:760px){ .rail{display:none} }

/* ---------- panneau documents ---------- */
#docpanel{position:fixed; top:0; bottom:var(--banner); right:var(--rail); width:var(--panel); z-index:45; background:var(--papier);
  border-left:2px solid var(--encre); box-shadow:-10px 0 28px rgba(28,37,48,.18); display:flex; flex-direction:column;
  transform:translateX(calc(100% + var(--rail) + 20px)); transition:transform .25s ease; visibility:hidden}
body.panel-open #docpanel{transform:none; visibility:visible}
@media (max-width:1180px){ :root{--panel:min(720px, calc(100vw - var(--rail) - 40px))} }
@media (max-width:760px){ #docpanel{right:0; width:100vw} }
.dp-head{display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1.5px solid var(--encre); background:#F4F5F2; flex-wrap:wrap}
.dp-head h3{margin:0; font:700 1.05rem/1.2 var(--f-titre); flex:1; min-width:180px}
.dp-head h3 small{display:block; font:500 .78rem var(--f-titre); color:var(--encre-2)}
.dp-head button{border:1px solid var(--trait); background:#fff; padding:4px 9px; cursor:pointer; border-radius:2px}
.dp-tabs{display:flex; gap:3px; padding:6px 10px; border-bottom:1px solid var(--trait-fin); overflow-x:auto}
.dp-tabs button{border:1px solid var(--trait); background:#fff; font:700 .82rem var(--f-titre); padding:3px 8px; cursor:pointer; white-space:nowrap; border-radius:2px}
.dp-tabs button[aria-selected="true"]{background:var(--encre); color:var(--jaune); border-color:var(--encre)}
.dp-body{flex:1; overflow:auto; padding:12px; --z:1; background:#E9EBE7}
.doc{display:none}
.doc.active{display:block}
.doc .doc-img{display:block; width:calc(var(--z) * 100%); max-width:none; background:#fff; border:1px solid var(--trait-fin); margin:0 auto 8px}
.doc .doc-text{background:#fff; padding:6px 16px; width:calc(var(--z) * 100%); margin:0 auto 8px; font-size:calc(var(--z) * .95rem)}
.doc .doc-text h3{font:700 1.1rem var(--f-titre)}
.doc .doc-cap{width:calc(var(--z) * 100%); margin:-2px auto 10px; font-size:.85rem; color:var(--encre-2); background:#fff; padding:4px 10px}
dl.steps dt{font:700 .98rem var(--f-titre); margin-top:10px}
dl.steps dd{margin:2px 0 0 0}

/* ---------- bandeau de note ---------- */
.banner{position:fixed; left:0; right:0; bottom:0; height:var(--banner); z-index:50; background:var(--encre); color:#fff;
  display:flex; align-items:center; gap:18px; padding:0 calc(var(--rail) + 14px) 0 18px; border-top:3px solid var(--jaune)}
.banner .score{font:700 1.7rem/1 var(--f-titre); color:var(--jaune); min-width:5.5ch; white-space:nowrap}
.banner .score small{font-size:.95rem; color:#fff}
.banner .lab{font:600 .8rem/1.15 var(--f-titre); color:#C9D1D8}
.banner .count{font-size:.9rem; color:#E7EBEE}
.banner .spacer{flex:1}
.banner .btn-docs{display:none; background:var(--jaune); color:var(--encre); border:0; padding:8px 12px; font:700 .9rem var(--f-titre); border-radius:2px; cursor:pointer}
@media (max-width:760px){ .banner{padding:0 12px; gap:10px} .banner .btn-docs{display:block} .banner .count{font-size:.78rem} }

/* ---------- auto-évaluation des tracés ---------- */
.selfeval{margin:12px 0 4px; border:1.5px solid var(--bleu); background:var(--bleu-pale); padding:10px 14px; max-width:78ch}
.selfeval[hidden]{display:none}
.se-title{margin:0 0 2px; font:700 1rem var(--f-titre)}
.se-lead{margin:0 0 8px; font-size:.9rem; color:var(--encre-2)}
.se-item{display:flex; gap:8px; align-items:flex-start; padding:4px 0; border-top:1px solid rgba(31,95,168,.18); cursor:pointer; font-size:.94rem}
.se-item input{margin-top:.25rem; width:17px; height:17px; flex:0 0 auto; accent-color:var(--bleu)}
.se-item input:disabled{cursor:default}
.se-foot{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px}
.se-score{font-weight:700; color:var(--bleu)}
.sketch.is-ok{border-left-color:var(--vert)} .sketch.is-half{border-left-color:var(--orange)} .sketch.is-ko{border-left-color:var(--rouge)}

/* ---------- récapitulatif ---------- */
.recap{background:var(--papier); border:2px solid var(--encre); margin:0 0 36px; padding:0 0 18px}
.recap-head{border-bottom:2px solid var(--encre); padding:14px 20px 12px; background:#F4F5F2}
.recap-head h2{margin:0 0 4px; font:700 1.5rem var(--f-titre)}

table.recap .rc-n{font:800 1.3rem var(--f-titre); color:var(--rouge)}
table.recap .rc-sch>div{display:flex; gap:4px; justify-content:center}
table.recap .rc-sch .schema{width:96px}
table.recap .rc-img img{height:70px; width:auto}

/* jeu */
.jeu{border:2px solid var(--bleu); background:var(--bleu-pale); padding:12px 16px}
.jeu-bar{height:8px; background:#fff; border:1px solid var(--trait); margin:0 0 8px}
#jeu-prog{height:100%; width:0; background:var(--bleu); transition:width .3s}
#jeu-num{font:700 .95rem var(--f-titre); color:var(--bleu); margin:0 0 6px}
#jeu-q p{margin:0 0 6px}
.jeu-sch{max-width:260px; background:#fff; border:1px solid var(--trait-fin); padding:6px}
#jeu-opts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:10px 0 6px; max-width:560px}
@media (max-width:520px){ #jeu-opts{grid-template-columns:1fr} }
#jeu-opts .btn{padding:10px; text-align:center; justify-content:center}
#jeu-opts .btn.good{background:var(--vert); color:#fff; border-color:var(--vert)}
#jeu-opts .btn.bad{background:var(--rouge); color:#fff; border-color:var(--rouge)}
#jeu-opts .btn:disabled{cursor:default; opacity:1}
.jeu-fb{font-weight:700; min-height:1.5em; margin:4px 0}
.jeu-fb.ok{color:var(--vert)} .jeu-fb.ko{color:var(--rouge)}
#jeu-end{text-align:center; padding:10px}
#jeu-score{font:800 2.2rem var(--f-titre)}
#jeu-stars{display:block; color:var(--jaune); font-size:2rem; letter-spacing:4px; -webkit-text-stroke:1px var(--encre)}

/* quiz (repris du dépôt RDM) */
.quiz{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px}
.quiz-q{border:1.5px solid var(--encre); background:#fff; padding:8px 14px 10px; margin:0}
.quiz-q legend{font-weight:700; padding:0 4px}
.quiz-q .q-num{display:inline-block; background:var(--encre); color:var(--jaune); padding:0 6px; margin-right:2px}
.quiz-q label{display:block; padding:3px 0; cursor:pointer}
.quiz-q.is-ok{border-color:var(--vert); background:var(--vert-pale)}
.quiz-q.is-ko{border-color:var(--rouge); background:var(--rouge-pale)}
.quiz-q label.good{font-weight:700; color:var(--vert)}
.quiz-fb{margin:4px 0 0; font-weight:700}
.quiz-q.is-ok .quiz-fb{color:var(--vert)} .quiz-q.is-ko .quiz-fb{color:var(--rouge)}
.quiz-why{margin:2px 0 0; font-size:.9rem}
.quiz-score{display:flex; align-items:center; gap:14px; margin:14px 0 0; font:700 1.3rem var(--f-titre)}
#qz-stars{color:var(--jaune); font-size:1.6rem; letter-spacing:2px}
.cours-foot{display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 0}
.home-back{margin:12px 0 0}

@media print{
  body.cours-page #home,body.hub #home{display:block!important; padding:0; min-height:0}
  .no-print,.cours-nav,.cours-foot,.home-back,.lx-axes,.lx-mob-btns,.lx-play,#cube-txt,.cube-btns,.jeu,.rc-filter,#def-play{display:none!important}
  .quiz-why[hidden]{display:block!important}
  #recap-body tr[hidden]{display:table-row!important}
  .part{break-inside:avoid-page}
}
.c-top{margin:0 0 12px}
.hero-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px 10px; max-width:420px; margin:0 auto; width:100%}

</style>
